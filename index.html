<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="message"></h1>
    <main class="game">
      <div class="player-table">
        <h1>Player</h1>
        <div class="cards-player">
          <img src="" alt="" class="player-card-img" />
          <img src="" alt="" class="player-card-img" />
        </div>
      </div>
      <div class="ai-table">
        <h1>AI</h1>
        <div class="cards-ai">
          <img src="" alt="" class="ai-card-img" />
          <img src="" alt="" class="ai-card-img" />
        </div>
      </div>
    </main>
    <div class="buttons-area">
      <button id="again-btn">Again!</button>
      <button id="hit-btn">Hit</button>
      <button id="stay-btn">Stay</button>
      <button id="doubledown-btn">Double Down <br><span>(Coming Soon)</span></button>
      <button id="split-btn">Split <br><span>(Coming Soon)</span></button>
    </div>
  </body>
</html>
